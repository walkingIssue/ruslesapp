name: Trigger rustlesWeb publish

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: Optional rustles_solution ref or SHA for rustlesWeb to publish
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - docs/devlog/**
      - docs/changelog/**

permissions:
  contents: read

env:
  RUSTLES_WEB_REPOSITORY: ${{ vars.RUSTLES_WEB_REPOSITORY || '' }}
  RUSTLES_APP_REPOSITORY: ${{ vars.RUSTLES_APP_REPOSITORY || github.repository }}

jobs:
  dispatch-rustles-web:
    runs-on: ubuntu-latest

    steps:
      - name: Validate website dispatch configuration
        shell: bash
        env:
          RUSTLES_WEB_REPO_TOKEN: ${{ secrets.RUSTLES_WEB_REPO_TOKEN }}
        run: |
          if [ -z "${RUSTLES_WEB_REPOSITORY}" ]; then
            echo "::error::Set the RUSTLES_WEB_REPOSITORY repository variable so docs changes can publish rustlesWeb."
            exit 1
          fi
          if [ -z "${RUSTLES_WEB_REPO_TOKEN}" ]; then
            echo "::error::Set the RUSTLES_WEB_REPO_TOKEN secret with permission to create repository_dispatch events in rustlesWeb."
            exit 1
          fi

      - name: Trigger website publish workflow
        shell: bash
        env:
          RUSTLES_WEB_REPO_TOKEN: ${{ secrets.RUSTLES_WEB_REPO_TOKEN }}
        run: |
          app_ref="${GITHUB_SHA}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.app_ref }}" ]; then
            app_ref="${{ inputs.app_ref }}"
          fi

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${RUSTLES_WEB_REPO_TOKEN}" \
            "https://api.github.com/repos/${RUSTLES_WEB_REPOSITORY}/dispatches" \
            -d '{
              "event_type": "rustles_app_content_changed",
              "client_payload": {
                "app_repo": "'"${RUSTLES_APP_REPOSITORY}"'",
                "app_ref": "'"${app_ref}"'",
                "content_paths": ["docs/devlog", "docs/changelog"]
              }
            }'
