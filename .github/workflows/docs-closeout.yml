name: Docs closeout

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  workflow_dispatch:
    inputs:
      base_ref:
        description: Optional base ref or SHA to diff from
        required: false
        type: string
      head_ref:
        description: Optional head ref or SHA to diff to
        required: false
        type: string

permissions:
  contents: read

jobs:
  generate-docs-closeout:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve diff refs
        id: refs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "${GITHUB_OUTPUT}"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "${GITHUB_OUTPUT}"
          else
            base_ref="${{ inputs.base_ref }}"
            head_ref="${{ inputs.head_ref }}"
            if [ -z "${base_ref}" ]; then
              base_ref="$(git rev-parse HEAD~1)"
            fi
            if [ -z "${head_ref}" ]; then
              head_ref="$(git rev-parse HEAD)"
            fi
            echo "base=${base_ref}" >> "${GITHUB_OUTPUT}"
            echo "head=${head_ref}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install openai pydantic

      - name: Generate docs-closeout artifacts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT || 'low' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          python .github/scripts/docs_closeout.py \
            --repo-root . \
            --base-ref "${{ steps.refs.outputs.base }}" \
            --head-ref "${{ steps.refs.outputs.head }}" \
            --out-dir .docs-closeout

      - name: Upload docs-closeout artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-closeout
          path: .docs-closeout

      - name: Publish summary
        shell: bash
        run: |
          cat .docs-closeout/session-summary.md >> "${GITHUB_STEP_SUMMARY}"
          printf '\n## Review files\n\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- `.docs-closeout/documentation-review.md`\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- `.docs-closeout/changelog-draft.md`\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- `.docs-closeout/privacy-review.md`\n' >> "${GITHUB_STEP_SUMMARY}"
          printf -- '- `.docs-closeout/devlog-scaffold.md`\n' >> "${GITHUB_STEP_SUMMARY}"
